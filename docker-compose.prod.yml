networks:
  migration-network:
    driver: bridge

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: migration-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: cloud_migration_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command: ["postgres", "-c", "max_connections=300"]
    networks:
      - migration-network

  redis-queue:
    image: redis:7-alpine
    container_name: migration-redis
    restart: always
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}" --bind 0.0.0.0
    volumes:
      - redis_data:/data
    networks:
      - migration-network

  api-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    container_name: migration-api
    restart: always
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres-db:5432/cloud_migration_db?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-queue:6379
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN:-}
      - PORT=8000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_PHOTOS_CLIENT_ID=${GOOGLE_PHOTOS_CLIENT_ID:-}
      - GOOGLE_PHOTOS_CLIENT_SECRET=${GOOGLE_PHOTOS_CLIENT_SECRET:-}
      - DROPBOX_CLIENT_ID=${DROPBOX_CLIENT_ID:-}
      - DROPBOX_CLIENT_SECRET=${DROPBOX_CLIENT_SECRET:-}
      - HIDRIVE_CLIENT_ID=${HIDRIVE_CLIENT_ID:-}
      - HIDRIVE_CLIENT_SECRET=${HIDRIVE_CLIENT_SECRET:-}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-}
      - LOCAL_STORAGE_ROOT=${LOCAL_STORAGE_ROOT:-}
      - FREE_TRANSFER_GB=${FREE_TRANSFER_GB:-}
      - COFFEE_REQUIRED=${COFFEE_REQUIRED:-}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_EMAIL=${PAYPAL_EMAIL:-}
    depends_on:
      - postgres-db
      - redis-queue
    networks:
      - migration-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/settings"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  migration-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
      additional_contexts:
        - api_build=backend
    container_name: migration-worker-1
    restart: always
    environment:
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres-db:5432/cloud_migration_db?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-queue:6379
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY}
      - LOCAL_STORAGE_ROOT=${LOCAL_STORAGE_ROOT:-}
      - COFFEE_REQUIRED=${COFFEE_REQUIRED:-}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
    depends_on:
      - postgres-db
      - redis-queue
    networks:
      - migration-network

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
    container_name: migration-frontend
    restart: always
    ports:
      - "3001:3000"
    networks:
      - migration-network

volumes:
  postgres_data:
  redis_data:

