<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clumoove // Einfacher Cloud-Umzug</title>
    <meta name="description" content="Clumoove überträgt deine Dateien sicher zwischen Cloud-Diensten. Wechsel von Dropbox, Google Drive, HiDrive, Nextcloud & mehr – ohne Download & Neu-Upload." />
    <meta name="keywords" content="Cloud Migration, Cloud-Umzug, Dropbox nach Google Drive, Nextcloud, HiDrive, Dateien umziehen" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://clumoove.app" />
    <script src="/dynamic-favicon.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Clumoove",
      "applicationCategory": "WebApplication",
      "operatingSystem": "Web",
      "description": "Cloud-to-Cloud Migration Tool. Überträgt Dateien zwischen Dropbox, Google Drive, HiDrive, Nextcloud und mehr.",
      "url": "https://clumoove.app",
      "offers": {
        "@type": "Offer",
        "price": "2.00",
        "priceCurrency": "EUR"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HowTo",
      "name": "Cloud-Umzug in 3 Schritten",
      "step": [
        { "@type": "HowToStep", "position": 1, "name": "Quelle & Ziel verbinden", "text": "Wähle deine Cloud-Quelle und dein Cloud-Ziel aus den unterstützten Anbietern." },
        { "@type": "HowToStep", "position": 2, "name": "Dateien auswählen", "text": "Wähle die Ordner und Dateien aus, die du umziehen möchtest." },
        { "@type": "HowToStep", "position": 3, "name": "Transfer starten", "text": "Starte den sicheren Direkt-Transfer zwischen den Clouds." }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
